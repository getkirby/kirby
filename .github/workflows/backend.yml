name: Backend

on:
  # only the long-lived base branches run on push, so that their caches
  # are seeded for the pull requests targeting them; feature/fix branches
  # are covered by the pull_request event instead, which can restore caches
  # from its base branch and keeps the same commit from running twice
  push:
    branches:
      - "main"
      - "develop-patch"
      - "develop-minor"
      - "v*/develop"
    paths: &backend-paths
      - "**"
      - "!.github/**"
      - ".github/workflows/backend.yml"
      - "!.tx/**"
      - "!.vscode/**"
      - "!assets/**"
      - "!panel/**"
      - "!scripts/**"
  pull_request:
    paths: *backend-paths
  workflow_call:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: CI
    uses: getkirby/actions/.github/workflows/php.yml@07e658b7eb1254cafc0baf94a2d241e810658176 # 0.3.0
    with:
      apt: locales-all imagemagick
      codecov-flags: backend
      composer-normalize: true
      extensions: mbstring, ctype, curl, gd, apcu, memcached, redis
      ini: 'apc.enabled=1, apc.enable_cli=1, pcov.directory=., pcov.exclude="~(vendor|tests)~"'
      phpunit-args: --configuration phpunit.ci.xml --processes 4
      sarif: ${{ github.repository == 'getkirby/kirby' }}
      services: redis memcached
      upstream: getkirby/kirby
    secrets: inherit
    permissions:
      contents: read
      # for the Psalm results in code scanning
      security-events: write
