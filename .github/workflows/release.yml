name: Release
on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:
    branches:
      - "main"
      - "release/**"

# the jobs of the called workflows get no more than this
permissions:
  contents: read
  security-events: write

jobs:
  release_backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    secrets: inherit
  release_frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml
    secrets: inherit
