name: Frontend

on:
  # only the long-lived base branches run on push, so that their caches
  # are seeded for the pull requests targeting them; feature/fix branches
  # are covered by the pull_request event instead, which can restore caches
  # from its base branch and keeps the same commit from running twice
  push:
    branches:
      - "main"
      - "develop-patch"
      - "develop-minor"
      - "v*/develop"
    paths: &frontend-paths
      - ".github/workflows/frontend.yml"
      - "panel/**"
      - "!panel/scripts/**"
  pull_request:
    paths: *frontend-paths
  workflow_call:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: CI
    uses: getkirby/actions/.github/workflows/node.yml@07e658b7eb1254cafc0baf94a2d241e810658176 # 0.3.0
    with:
      codecov-flags: frontend
      upstream: getkirby/kirby
      working-directory: panel
    secrets: inherit
